
name: GitHub Secrets Check

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Verify required secrets are configured
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$HUBSPOT_ACCESS_TOKEN" ]; then
            echo "HUBSPOT_ACCESS_TOKEN secret is missing."
            exit 1
          fi

          echo "Both required GitHub Secrets are available."
